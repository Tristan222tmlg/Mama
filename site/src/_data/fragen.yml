# Häufige Fragen. Die Antworten sind Sabines Worte aus ihren Antworten vom
# 30. Oktober 2026, für die Website leicht gekürzt. Markdown ist erlaubt.

- frage: Kommst du auch zu mir in den Garten?
  anker: vor-ort
  antwort: |
    Nein. Ich arbeite online, deshalb ist es egal, wo du wohnst. Vor Ort bin ich mit langfristigen Projekten ausgebucht.

- frage: Nützt das überhaupt etwas, wenn ich hier ein bisschen was pflanze?
  anker: nutzen
  antwort: |
    Ja. Für eine Wildbiene ist eine kleine Fläche schon der ganze Lebensraum. Viele Wildbienen haben nur einen Radius von wenigen hundert Metern ([Zurbuchen und andere, 2010](https://www.sciencedirect.com/science/article/abs/pii/S0006320709005114)). In diesem Radius brauchen sie die Pflanzen, deren Pollen sie sammeln.

    Wildbienen sind spezifisch in ihren Pollenbedürfnissen. Die Glänzende Natterkopf-Mauerbiene zum Beispiel sammelt Pollen nur an Natterkopf-Arten ([Westrich](https://www.wildbienen.info/steckbriefe/osmia_adunca.php)). Wenn diese Pflanzen da sind, kann die Biene ihre Kinder ernähren. Es macht für die Tiere einen Riesenunterschied.

    Jeder Garten kann ein Trittstein sein, von dem aus andere Flächen erreicht und neue Flächen besiedelt werden.

- frage: Ist das nicht zu kompliziert für mich?
  anker: kompliziert
  antwort: |
    Da kann sich jeder trauen. Ich erkläre das allgemein verständlich, und es kann immer alles gefragt werden. Es gibt keine dummen Fragen.

- frage: Sieht ein naturnaher Garten nicht unordentlich aus?
  anker: unordentlich
  antwort: |
    Es gibt einen ganz großen Spielraum, wie naturnahe Gärten aussehen können. Sie können unordentlich sein, und sie können auch ziemlich ordentlich sein. Da haben wir Einfluss auf die Gestaltung. Es gibt nicht den einen naturnahen Garten.

- frage: Geht das auch auf dem Balkon?
  anker: balkon
  antwort: |
    Ja. Das Online-Programm ist für Menschen mit Garten, Balkon oder Gemeinschaftsgarten gedacht. Die Moschus-Malve zum Beispiel wächst auch im Topf.

- frage: Welche Tiere sind gut, welche schlecht?
  anker: gute-tiere
  antwort: |
    Diese Einteilung gibt es bei mir nicht. <span data-ton-ok>„Schädling“ und „Nützling“</span> führen zu nichts: Dann gibt es wieder gute und schlechte Tiere, die schlechten muss man entfernen, und dann kommt der ganze Kreislauf durcheinander.

- frage: Was ist bei dir anders als in einer Gärtnerei?
  anker: gaertnerei
  antwort: |
    Gärtnereien verkaufen Pflanzen, und Garten- und Landschaftsbauer bauen Wege, Treppen und Terrassen. Bei mir geht es darum, dass du weißt, warum du etwas tust: dass du ein Verständnis für die Natur und die Tiere entwickelst und lernst zu sehen, wie sich Pflanzen übers Jahr entwickeln.

- frage: Was kostet das Online-Programm?
  anker: preis
  antwort: |
    Preise stehen nicht auf der Website. Den Preis nenne ich dir im Erstgespräch. [[offen: so gewünscht?]]

- frage: Was ist der Gartenbrief?
  anker: gartenbrief
  antwort: |
    Mein Newsletter, den ich gelegentlich per E-Mail schicke. Du kannst ihn jederzeit abbestellen. [[offen: wie oft und worüber]]
